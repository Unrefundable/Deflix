name: Sync KDMM into the Deflix repository

# Most devices get KDMM from the copy inside the published Deflix repository
# (see tools/sync_kdmm.py). This picks up new KDMM releases without anyone
# having to rebuild and republish Deflix. It only ever touches the KDMM files
# and addons.xml on gh-pages; the skin is published by hand as before.
#
# GitHub pauses scheduled workflows after 60 days without repository activity;
# re-enable it on the Actions tab, or use "Run workflow", if that happens.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      rebuild_pages:
        description: Ask GitHub Pages to rebuild even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tools
        uses: actions/checkout@v5
        with:
          path: source
          sparse-checkout: tools

      - name: Check out the published site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Mirror KDMM's current release
        run: python3 source/tools/sync_kdmm.py site

      - name: Publish
        id: publish
        working-directory: site
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          version=$(sed -n 's/.*id="plugin.video.kdmm" version="\([^"]*\)".*/\1/p' repository/addons.xml)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror KDMM ${version}"
          git push origin HEAD:gh-pages
          echo "published=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token is not guaranteed to start a
      # Pages build for a site served from a branch, so ask for one.
      - name: Ask GitHub Pages to rebuild
        if: steps.publish.outputs.published == 'true' || inputs.rebuild_pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
